[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filemgr"
version = "0.1.0"
description = "Interactive CLI file management prototype"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["file", "management", "cli", "windows"]

[project.scripts]
filemgr = "filemgr:filemgr"
